name: Step 4 official-library draft smoke tests

on:
  push:
    branches: [feature/official-library-colab]
  pull_request:
    paths:
      - 'src/tfl_agent/**'
      - 'tests/test_step4_official_draft.py'
      - 'tests/test_step4_adaptation_planner.py'
      - 'tests/test_step4_adaptation_v2.py'
      - 'tests/test_step4_adaptation_v3.py'
      - 'tests/test_step4_adaptation_v4.py'
      - 'tests/test_step4_auto_text_draft.py'
      - 'tests/test_e2e_ae_pilot.py'
      - 'tests/test_blueprint_reconstruction.py'
      - 'notebooks/10_Drive_SAP_Blueprint_Reconstruction.ipynb'
      - 'notebooks/09_One_SAP_to_AE_Shell_End_to_End.ipynb'
      - '.github/workflows/step4-draft-tests.yml'

jobs:
  draft-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Exercise Step 4 draft generation and adaptation planning
        run: python -m pytest -q tests/test_step4_official_draft.py tests/test_step4_adaptation_planner.py tests/test_step4_adaptation_v2.py tests/test_step4_adaptation_v3.py tests/test_step4_adaptation_v4.py tests/test_step4_auto_text_draft.py tests/test_e2e_ae_pilot.py tests/test_blueprint_reconstruction.py
