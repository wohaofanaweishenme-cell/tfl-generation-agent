name: Bootstrap TFL project sources
on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
permissions:
  contents: write
jobs:
  expand-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Expand vetted project archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile
          data=base64.b64decode(Path("_bootstrap/project_payload.b64").read_text())
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data)), mode="r:") as tar:
              for member in tar.getmembers():
                  p=Path(member.name)
                  if p.is_absolute() or ".." in p.parts or not member.isfile():
                      raise ValueError("Unsafe tar member: "+member.name)
                  dest=Path(".")/p
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(tar.extractfile(member).read())
          PY
      - name: Install dependencies and generate synthetic demo fixtures
        run: |
          python -m pip install reportlab
          python -m pip install -e ".[notebook,test]"
          python examples/make_demo.py
      - name: Run tests
        run: python -m pytest -q
      - name: Commit verified project sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f _bootstrap/project_payload.b64
          git rm -f .github/workflows/bootstrap.yml
          git add -A
          git commit -m "Import complete TFL Agent MVP, notebooks and demo fixtures"
          git push origin HEAD:main
