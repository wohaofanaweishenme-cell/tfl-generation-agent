[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfl-generation-agent-mvp"
version = "0.2.0"
description = "Jupyter-first, auditable SAP-to-TFL Table Shell MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "jsonschema>=4.22,<5",
    "openai>=1.60,<3",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "pandas>=2,<3"]
test = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["src"]
